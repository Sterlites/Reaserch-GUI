<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Agentic Architecture Bible (2026) — Engineering Cockpit</title>
  <!-- Optional web fonts with graceful offline system fallbacks -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ========================================================================
       DESIGN TOKENS & RESET (Linear / Vercel / Raycast Obsidian Cockpit)
    ======================================================================== */
    :root {
      --bg-canvas: #07090F;
      --bg-surface: #0D111A;
      --bg-elevated: #131926;
      --bg-hover: #192234;
      --border-hairline: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;

      --cyan: #22D3EE;
      --cyan-soft: rgba(34, 211, 238, 0.12);
      --cyan-border: rgba(34, 211, 238, 0.35);

      --indigo: #818CF8;
      --indigo-soft: rgba(129, 140, 248, 0.12);
      --indigo-border: rgba(129, 140, 248, 0.35);

      --emerald: #34D399;
      --emerald-soft: rgba(52, 211, 153, 0.12);
      --emerald-border: rgba(52, 211, 153, 0.35);

      --amber: #FBBF24;
      --amber-soft: rgba(251, 191, 36, 0.12);
      --amber-border: rgba(251, 191, 36, 0.35);

      --rose: #FB7185;
      --rose-soft: rgba(251, 113, 133, 0.12);
      --rose-border: rgba(251, 113, 133, 0.35);

      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --shadow-card: 0 10px 30px -10px rgba(0, 0, 0, 0.65);
      --shadow-glow-cyan: 0 0 32px rgba(34, 211, 238, 0.12);
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-canvas);
      background-image:
        radial-gradient(ellipse 80% 50% at 15% -10%, rgba(99, 102, 241, 0.14), transparent 60%),
        radial-gradient(ellipse 70% 45% at 85% -5%, rgba(34, 211, 238, 0.10), transparent 55%),
        radial-gradient(ellipse 60% 40% at 50% 110%, rgba(52, 211, 153, 0.07), transparent 60%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* Subtle engineering dot/grid overlay */
    .bg-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse at center, black 35%, transparent 85%);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-canvas); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.24); }

    button, input, select { font-family: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: none; }

    .mono { font-family: var(--font-mono); }
    .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ========================================================================
       STICKY FROSTED HEADER & NAVIGATION
    ======================================================================== */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(7, 9, 15, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border-hairline);
    }

    .header-inner {
      max-width: 1340px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #22D3EE 0%, #6366F1 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #07090F;
      box-shadow: 0 0 22px rgba(34, 211, 238, 0.28);
      flex-shrink: 0;
    }

    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .edition-pill {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 99px;
      background: var(--cyan-soft);
      color: var(--cyan);
      border: 1px solid var(--cyan-border);
      letter-spacing: 0.04em;
    }

    .brand-sub {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      overflow-x: auto;
      padding: 2px;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }

    .nav-tab {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      border: 1px solid transparent;
      transition: all var(--transition);
      white-space: nowrap;
    }

    .nav-tab:hover {
      color: var(--text-primary);
      background: rgba(255, 255, 255, 0.04);
    }

    .nav-tab.active {
      color: var(--text-primary);
      background: var(--bg-elevated);
      border-color: var(--cyan-border);
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.12);
    }

    .nav-tab.active svg { color: var(--cyan); }

    .kbd {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      line-height: 1.4;
    }

    .nav-tab.active .kbd {
      background: var(--cyan-soft);
      border-color: var(--cyan-border);
      color: var(--cyan);
    }

    .cmd-trigger {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      color: var(--text-secondary);
      font-size: 12.5px;
      transition: all var(--transition);
      flex-shrink: 0;
    }

    .cmd-trigger:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
      background: var(--bg-elevated);
    }

    /* ========================================================================
       MAIN LAYOUT & SHARED COMPONENTS
    ======================================================================== */
    .main-wrap {
      position: relative;
      z-index: 1;
      max-width: 1340px;
      margin: 0 auto;
      padding: 24px 20px 64px;
    }

    .module-panel {
      display: none;
      animation: fadeSlideIn 260ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .module-panel.active { display: block; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow-card);
    }

    .card-elevated {
      background: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      padding: 16px;
    }

    .section-kicker {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--cyan);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      margin-top: 4px;
    }

    .section-desc {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      padding: 3px 9px;
      border-radius: 99px;
      border: 1px solid var(--border-hairline);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
    }
    .badge-cyan { background: var(--cyan-soft); color: var(--cyan); border-color: var(--cyan-border); }
    .badge-indigo { background: var(--indigo-soft); color: var(--indigo); border-color: var(--indigo-border); }
    .badge-emerald { background: var(--emerald-soft); color: var(--emerald); border-color: var(--emerald-border); }
    .badge-amber { background: var(--amber-soft); color: var(--amber); border-color: var(--amber-border); }
    .badge-rose { background: var(--rose-soft); color: var(--rose); border-color: var(--rose-border); }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      background: linear-gradient(135deg, #22D3EE 0%, #38BDF8 100%);
      color: #050811;
      font-size: 13px;
      font-weight: 700;
      transition: all var(--transition);
      box-shadow: 0 4px 18px rgba(34, 211, 238, 0.25);
    }
    .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.08); }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      color: var(--text-primary);
      font-size: 12.5px;
      font-weight: 500;
      transition: all var(--transition);
    }
    .btn-secondary:hover {
      border-color: var(--cyan-border);
      color: var(--cyan);
      background: rgba(34, 211, 238, 0.06);
    }

    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .stack-gap { display: flex; flex-direction: column; gap: 20px; }

    /* ========================================================================
       MODULE 1: DECISION ENGINE
    ======================================================================== */
    .selector-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: block;
    }

    .archetype-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .pill-card {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 13px;
      border-radius: 12px;
      background: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      text-align: left;
      transition: all var(--transition);
    }
    .pill-card:hover {
      border-color: var(--border-strong);
      background: var(--bg-elevated);
    }
    .pill-card.selected {
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.12), rgba(99, 102, 241, 0.08));
      border-color: var(--cyan-border);
      box-shadow: 0 0 22px rgba(34, 211, 238, 0.1);
    }

    .pill-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-hairline);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
    .pill-card.selected .pill-icon {
      background: var(--cyan-soft);
      border-color: var(--cyan-border);
      color: var(--cyan);
    }

    .pill-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
    .pill-sub { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }

    .choice-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .choice-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 13px;
      border-radius: 10px;
      background: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all var(--transition);
    }
    .choice-pill:hover { border-color: var(--border-strong); color: var(--text-primary); }
    .choice-pill.selected-indigo {
      background: var(--indigo-soft);
      border-color: var(--indigo-border);
      color: #E0E7FF;
    }
    .choice-pill.selected-emerald {
      background: var(--emerald-soft);
      border-color: var(--emerald-border);
      color: #D1FAE5;
    }

    /* 5-Layer Visual Pipeline */
    .pipeline-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
      position: relative;
    }

    .pipeline-node {
      position: relative;
      background: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color var(--transition);
    }
    .pipeline-node:hover { border-color: var(--cyan-border); }

    .pipeline-arrow {
      position: absolute;
      right: -13px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 2;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--cyan-border);
      color: var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pipeline-step {
      font-family: var(--font-mono);
      font-size: 10px;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 8px;
      display: inline-block;
    }
    .pipeline-tech {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 5px;
      line-height: 1.35;
    }
    .pipeline-role { font-size: 12px; color: var(--text-secondary); }

    /* Timeline */
    .timeline-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      position: relative;
    }
    .timeline-card {
      background: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
      padding: 15px;
      border-top-width: 2px;
    }

    .callout-box {
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border-hairline);
    }
    .callout-indigo { background: rgba(99, 102, 241, 0.08); border-color: var(--indigo-border); }
    .callout-emerald { background: rgba(16, 185, 129, 0.08); border-color: var(--emerald-border); }
    .callout-amber { background: rgba(245, 158, 11, 0.08); border-color: var(--amber-border); }
    .callout-rose { background: rgba(244, 63, 94, 0.08); border-color: var(--rose-border); }

    .list-clean {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .list-clean li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.45;
    }

    /* ========================================================================
       MODULE 2: USE-CASE BIBLE & SLIDE-OVER DRAWER
    ======================================================================== */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      width: 290px;
      max-width: 100%;
    }
    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border-radius: 10px;
      background: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      font-size: 13px;
      color: var(--text-primary);
      outline: none;
      transition: border-color var(--transition);
    }
    .search-input:focus { border-color: var(--cyan-border); }

    .bp-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      cursor: pointer;
      transition: all var(--transition);
      text-align: left;
    }
    .bp-card:hover {
      border-color: var(--cyan-border);
      transform: translateY(-2px);
      box-shadow: 0 14px 32px -12px rgba(34, 211, 238, 0.16);
      background: #101623;
    }

    .diff-shift {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 8px;
      background: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
    }

    /* Slide-over Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(3, 5, 10, 0.72);
      backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

    .drawer-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 65;
      width: min(740px, 100vw);
      background: var(--bg-surface);
      border-left: 1px solid var(--border-strong);
      box-shadow: -24px 0 60px rgba(0, 0, 0, 0.7);
      transform: translateX(100%);
      transition: transform 280ms cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
    }
    .drawer-panel.open { transform: translateX(0); }

    .drawer-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      background: rgba(7, 9, 15, 0.65);
    }
    .drawer-body {
      padding: 22px 24px 32px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .drawer-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border-hairline);
      background: rgba(7, 9, 15, 0.85);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .ascii-box {
      font-family: var(--font-mono);
      font-size: 11.5px;
      line-height: 1.45;
      background: #06080E;
      border: 1px solid var(--border-hairline);
      border-radius: 12px;
      padding: 14px 16px;
      color: #A5F3FC;
      overflow-x: auto;
      white-space: pre;
    }

    /* ========================================================================
       MODULE 3: RUNTIME ARENA & FEEDBACK LOOP VISUALIZER
    ======================================================================== */
    .segmented {
      display: inline-flex;
      background: var(--bg-canvas);
      padding: 4px;
      border-radius: 11px;
      border: 1px solid var(--border-hairline);
      gap: 4px;
    }
    .seg-btn {
      padding: 7px 13px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all var(--transition);
    }
    .seg-btn.active-emerald {
      background: var(--emerald-soft);
      color: var(--emerald);
      border: 1px solid var(--emerald-border);
    }
    .seg-btn.active-rose {
      background: var(--rose-soft);
      color: var(--rose);
      border: 1px solid var(--rose-border);
    }
    .seg-btn.active-cyan {
      background: var(--cyan-soft);
      color: var(--cyan);
      border: 1px solid var(--cyan-border);
    }

    .loop-stage {
      background: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      border-radius: 13px;
      padding: 15px;
      transition: all 260ms ease;
      position: relative;
      cursor: pointer;
    }
    .loop-stage.pulse-emerald {
      border-color: var(--emerald-border);
      background: rgba(52, 211, 153, 0.09);
      box-shadow: 0 0 24px rgba(52, 211, 153, 0.14);
      transform: translateY(-2px);
    }
    .loop-stage.pulse-rose {
      border-color: var(--rose-border);
      background: rgba(251, 113, 133, 0.09);
      box-shadow: 0 0 24px rgba(251, 113, 133, 0.14);
      transform: translateY(-2px);
    }

    .bar-track {
      height: 8px;
      width: 100%;
      background: var(--bg-canvas);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--border-hairline);
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 420ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    .arena-table-wrap {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid var(--border-hairline);
      background: var(--bg-surface);
    }
    table.arena-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 880px;
      text-align: left;
    }
    table.arena-table th {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      background: var(--bg-canvas);
      padding: 13px 16px;
      border-bottom: 1px solid var(--border-hairline);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    table.arena-table th:hover { color: var(--cyan); }
    table.arena-table td {
      padding: 15px 16px;
      border-bottom: 1px solid var(--border-hairline);
      vertical-align: top;
      font-size: 13px;
    }
    table.arena-table tr:last-child td { border-bottom: none; }
    table.arena-table tbody tr:hover { background: rgba(255, 255, 255, 0.025); }

    /* ========================================================================
       MODULE 4: COST-AT-SCALE PRICING LAB
    ======================================================================== */
    .slider-card {
      background: var(--bg-canvas);
      border: 1px solid var(--border-hairline);
      border-radius: 13px;
      padding: 15px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 99px;
      background: #1E293B;
      outline: none;
      margin: 12px 0 6px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--cyan);
      border: 2px solid #07090F;
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.6);
      cursor: pointer;
      transition: transform 120ms ease;
    }
    input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--cyan);
      border: 2px solid #07090F;
      cursor: pointer;
    }

    .cost-bar-track {
      height: 14px;
      background: var(--bg-canvas);
      border-radius: 99px;
      border: 1px solid var(--border-hairline);
      overflow: hidden;
    }
    .cost-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 360ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ========================================================================
       MODULE 5: PER-STACK AGENT SETUP FILES
    ======================================================================== */
    .setup-layout {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    .code-shell {
      background: #060911;
      border: 1px solid var(--border-hairline);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .code-toolbar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-hairline);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .code-viewer {
      padding: 20px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.65;
      color: #CBD5E1;
      overflow-x: auto;
      max-height: 72vh;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .syn-h1 { color: #22D3EE; font-weight: 700; }
    .syn-h2 { color: #818CF8; font-weight: 700; }
    .syn-bullet { color: #34D399; font-weight: 600; }
    .syn-code { color: #FBBF24; }
    .syn-comment { color: #64748B; }
    .syn-warn { color: #FB7185; font-weight: 700; }

    /* ========================================================================
       COMMAND PALETTE (Cmd+K / Ctrl+K) & TOAST
    ======================================================================== */
    .cmd-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(3, 5, 10, 0.78);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 10vh 16px 16px;
    }
    .cmd-backdrop.open { display: flex; }

    .cmd-modal {
      width: min(640px, 100%);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      animation: fadeSlideIn 160ms ease;
    }

    .cmd-input-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-hairline);
    }
    .cmd-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 15px;
      color: var(--text-primary);
    }

    .cmd-results {
      max-height: 390px;
      overflow-y: auto;
      padding: 8px;
    }

    .cmd-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      text-align: left;
      transition: background 100ms ease;
    }
    .cmd-item:hover, .cmd-item.active {
      background: var(--bg-elevated);
    }
    .cmd-item.active {
      outline: 1px solid var(--cyan-border);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 95;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: 12px;
      background: #0F172A;
      border: 1px solid var(--emerald-border);
      color: #ECFDF5;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65);
      transform: translateY(20px);
      opacity: 0;
      pointer-events: none;
      transition: all 220ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    .footer {
      border-top: 1px solid var(--border-hairline);
      padding: 20px;
      margin-top: 24px;
      position: relative;
      z-index: 1;
    }
    .footer-inner {
      max-width: 1340px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    ======================================================================== */
    @media (max-width: 1100px) {

      .pipeline-arrow { display: none; }
      .setup-layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 860px) {
      .archetype-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-3, .timeline-grid { grid-template-columns: 1fr; }
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-2 { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      .archetype-grid { grid-template-columns: 1fr; }
      .pipeline-grid { grid-template-columns: 1fr; }
      .grid-4 { grid-template-columns: 1fr; }
      .header-inner { padding: 10px 14px; }
      .main-wrap { padding: 16px 14px 48px; }
      .card { padding: 16px; }
    }

      let toastTimeout = null;

        el.innerHTML = `<span style="color:var(--emerald);display:inline-flex;">${ICONS.checkCircle(16)}</span><span>${escapeHtml(msg)}</span>`;
        el.classList.add('show');

        toastTimeout = setTimeout(() => el.classList.remove('show'), 2600);
      }

      function copyText(text, successMsg = 'Copied to clipboard') {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).then(
            () => showToast(successMsg),
            () => fallbackCopy(text, successMsg)
          );
        } else {
          fallbackCopy(text, successMsg);
        }
      }

      function fallbackCopy(text, successMsg) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast(successMsg);
        } catch (e) {
          showToast('Copy failed — please select manually');
        }
        document.body.removeChild(ta);

      function escapeHtml(str) {

          .replace(/</g, '&lt;')

        const minLog = Math.log10(100_000);
        const maxLog = Math.log10(500_000_000);
        const raw = Math.pow(10, minLog + (idx / 100) * (maxLog - minLog));
        if (raw < 1_000_000) return Math.round(raw / 50_000) * 50_000;
        if (raw < 10_000_000) return Math.round(raw / 250_000) * 250_000;
        if (raw < 100_000_000) return Math.round(raw / 1_000_000) * 1_000_000;
        return Math.round(raw / 5_000_000) * 5_000_000;

      function computeCosts() {
        const reqs = sliderToReqs(state.costReqsIdx);
        const reqsM = reqs / 1_000_000;
        const wallMs = state.costWallMs;
        const cpuRatio = state.costCpuPct / 100;
        const cpuMs = wallMs * cpuRatio;
        const egressGb = state.costEgressGb;
        const ws = state.costWs;
        const avgRps = reqs / (30 * 24 * 3600);

        // 1. Cloudflare Edge (Workers CPU-time + $0 Egress R2 + Durable Objects Hibernatable WS)
        const cfBase = 5;
        const cfCompute = Math.max(0, reqsM - 10) * 0.30 + Math.max(0, (reqs * cpuMs) / 1_000_000 - 30) * 0.02;
        const cfEgress = 0;
        const cfWs = ws > 0 ? 5 + (ws / 1000) * 2.2 : 0;
        const cfTotal = Math.round(cfBase + cfCompute + cfEgress + cfWs);

        // 2. Lean Go/Rust Containers (Hetzner/Fly.io flat compute + cheap bandwidth)
        const cpuWork = Math.max(0.35, cpuRatio * (wallMs / 60));
        const nodesReq = Math.ceil((avgRps * cpuWork) / 170);
        const nodesWs = Math.ceil(ws / 18000);
        const nodes = Math.max(2, nodesReq + nodesWs);
        const contBase = 15; // Managed/Self-hosted PG/SQLite backup
        const contCompute = nodes * 18;
        const contEgress = Math.max(0, egressGb - 2000) * 0.012;
        const contWs = 0;
        const contTotal = Math.round(contBase + contCompute + contEgress + contWs);

        // 3. AWS Serverless (Lambda 512MB Wall-Time + HTTP API GW + $0.09/GB Egress + API GW WS)
        const awsBase = 25; // Aurora/Dynamo base
        const awsApiGw = reqsM * 1.00;
        const awsLambdaReq = Math.max(0, reqsM - 1) * 0.20;
        const awsGbSec = reqs * (wallMs / 1000) * 0.5;
        const awsDuration = Math.max(0, awsGbSec - 400_000) * 0.00001667;
        const awsCompute = awsApiGw + awsLambdaReq + awsDuration;
        const awsEgress = Math.max(0, egressGb - 100) * 0.09;
        const awsWs = ws > 0 ? ((ws * 43200) / 1_000_000) * 0.25 + (ws / 1000) * 4.5 : 0;
        const awsTotal = Math.round(awsBase + awsCompute + awsEgress + awsWs);

        // 4. Managed PaaS (Vercel Pro + Managed DB + Pusher/Ably WS)
        const paasBase = 45;
        const paasCompute = reqsM * 0.65 + reqs * (wallMs / 1000) * 0.000011;
        const paasEgress = Math.max(0, egressGb - 1000) * 0.15;
        const paasWs = ws > 0 ? 49 + (ws / 1000) * 14 : 0;
        const paasTotal = Math.round(paasBase + paasCompute + paasEgress + paasWs);

        const items = [
          { id: 'cf', name: 'Cloudflare Edge', sub: 'Workers CPU-Time + R2 ($0 Egress) + DO', color: 'var(--cyan)', total: cfTotal, compute: Math.round(cfCompute), egress: 0, ws: Math.round(cfWs), base: cfBase },
          { id: 'cont', name: 'Lean Go / Rust Containers', sub: `${nodes}x HA Nodes (Hetzner / Fly.io)`, color: 'var(--emerald)', total: contTotal, compute: Math.round(contCompute), egress: Math.round(contEgress), ws: 0, base: contBase },
          { id: 'aws', name: 'AWS Serverless', sub: 'Lambda Wall-Time + API GW + $0.09/GB Egress', color: 'var(--amber)', total: awsTotal, compute: Math.round(awsCompute), egress: Math.round(awsEgress), ws: Math.round(awsWs), base: awsBase },
          { id: 'paas', name: 'Managed PaaS', sub: 'Vercel Pro + Managed DB + WS Add-on', color: 'var(--indigo)', total: paasTotal, compute: Math.round(paasCompute), egress: Math.round(paasEgress), ws: Math.round(paasWs), base: paasBase }
        ];

        const sorted = [...items].sort((a, b) => a.total - b.total);
        const winner = sorted[0];
        const runnerUp = sorted[1];
        const maxCost = Math.max(...items.map((x) => x.total), 50);

        let cfoInsight = '';
        if (winner.id === 'cf') {
          if (wallMs >= 1000 && state.costCpuPct <= 20) {
            cfoInsight = `Cloudflare Edge crushes AWS Lambda here: your workload waits ${wallMs}ms on I/O (like LLM streaming) with only ${Math.round(cpuMs)}ms of active CPU. Lambda bills the full wall-clock duration ($${Math.round(awsDuration).toLocaleString()}/mo), whereas Workers bill only CPU ticks.`;
          } else if (egressGb >= 3000) {
            cfoInsight = `Bandwidth egress is the silent killer: AWS charges ~$${Math.round(awsEgress).toLocaleString()}/mo for ${formatGb(egressGb)} of egress, while Cloudflare R2 charges $0.00/GB—saving you $${(runnerUp.total - winner.total).toLocaleString()}/mo.`;
          } else {
            cfoInsight = `Cloudflare Edge delivers the lowest total bill ($${winner.total.toLocaleString()}/mo) by combining zero idle server overhead, CPU-time billing, and hibernatable WebSockets.`;
          }
        } else {
          cfoInsight = `Lean Go/Rust containers win ($${winner.total.toLocaleString()}/mo across ${nodes} HA nodes). Under sustained high CPU (${state.costCpuPct}%), massive request volume (${formatReqs(reqs)}/mo), or ${ws.toLocaleString()} live WebSockets, flat bare-metal compute density beats per-invocation cloud pricing.`;
        }

        return { reqs, items, winner, runnerUp, maxCost, cfoInsight };
      }

                  <div class="mono" style="display:flex;flex-direction:column;gap:7px;font-size:12px;border-top:1px solid var(--border-hairline);padding-top:12px;">
                    <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-secondary);">Compute</span><span>$${it.compute.toLocaleString()}</span></div>
                    <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-secondary);">Egress</span><span style="color:${it.egress === 0 ? 'var(--emerald)' : '#fff'};font-weight:${it.egress === 0 ? '700' : '400'};">$${it.egress.toLocaleString()}</span></div>
                    <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-secondary);">Realtime/WS</span><span>$${it.ws.toLocaleString()}</span></div>
                    <div style="display:flex;justify-content:space-between;"><span style="color:var(--text-secondary);">Base / DB</span><span>$${it.base.toLocaleString()}</span></div>
                    <div style="display:flex;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border-hairline);font-size:14px;font-weight:800;color:#fff;">
                      <span>Total</span><span>$${it.total.toLocaleString()}</span>
                    </div>
                  </div>
                </div>
              `;
              })
              .join('')}
          </div>
        `;
      }

      /* --------------------------------------------------------------------
         14. MODULE 5: PER-STACK AGENT SETUP FILES
      -------------------------------------------------------------------- */
      function getFormattedSetupContent(file, format) {
        if (format === '.cursorrules') return file.content.replace('# AGENTS.md', '# .cursorrules');
        if (format === 'GEMINI.md') return file.content.replace('# AGENTS.md', '# GEMINI.md (Gemini Neon / CLI Agent Rules)');
        return file.content;
      }

      function renderSetupFiles() {
        const panel = document.getElementById('panel-setup');
        const activeFile = SETUP_FILES.find((f) => f.id === state.setupId) || SETUP_FILES[0];
        const rawText = getFormattedSetupContent(activeFile, state.setupFormat);

        panel.innerHTML = `
          <div class="setup-layout">
            <!-- Left Stack Selector -->
            <div class="stack-gap" style="gap:14px;">
              <div class="card" style="padding:18px;">
                <span class="section-kicker">${ICONS.fileCode(13)} 7 PRODUCTION STACKS</span>
                <h2 style="font-size:17px;font-weight:700;color:#fff;margin:4px 0 6px;">Per-Stack Agent Setup Files</h2>
                <p style="font-size:12.5px;color:var(--text-secondary);margin-bottom:14px;">Drop into your repository root so frontier coding agents obey strict architecture rules and automated compiler verification loops.</p>
                <div style="display:flex;flex-direction:column;gap:8px;">
                  ${SETUP_FILES.map(
                    (f) => `
                    <button class="pill-card ${f.id === activeFile.id ? 'selected' : ''}" data-setup-id="${f.id}" style="width:100%;">
                      <div style="min-width:0;">
                        <div class="mono" style="font-size:12.5px;font-weight:700;color:#fff;">${f.name}</div>
                        <div style="font-size:11.5px;color:var(--text-secondary);margin-top:2px;">${f.subtitle}</div>
                      </div>
                    </button>
                  `
                  ).join('')}
                </div>
              </div>

              <div class="callout-box callout-indigo">
                <div class="mono" style="font-size:11px;font-weight:700;color:var(--indigo);margin-bottom:6px;">WHY SECTION 4 MATTERS MOST</div>
                <p style="font-size:12.5px;color:#E2E8F0;line-height:1.5;">Every setup file embeds a <strong>Mandatory Verification Loop</strong> (e.g., <code class="mono" style="color:var(--cyan);">cargo clippy</code>, <code class="mono" style="color:var(--cyan);">tsc --noEmit</code>, <code class="mono" style="color:var(--cyan);">go test -race</code>). Agents auto-fix 90%+ of mistakes before you review a single line.</p>
              </div>
            </div>

            <!-- Right Syntax-Styled Code Viewer -->
            <div class="code-shell">
              <div class="code-toolbar">
                <div class="segmented">
                  ${['AGENTS.md', '.cursorrules', 'GEMINI.md']
                    .map(
                      (fmt) => `
                    <button class="seg-btn ${state.setupFormat === fmt ? 'active-cyan' : ''}" data-fmt="${fmt}">${fmt}</button>
                  `
                    )
                    .join('')}
                </div>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <button class="btn-secondary" id="copy-setup-btn">${ICONS.copy(14)} Copy to Clipboard</button>
                  <button class="btn-primary" id="dl-setup-btn" style="padding:8px 14px;font-size:12.5px;">${ICONS.download(14)} Download ${state.setupFormat}</button>
                </div>
              </div>
              <pre class="code-viewer">${highlightMarkdown(rawText)}</pre>
            </div>
          </div>
        `;

        panel.querySelectorAll('[data-setup-id]').forEach((b) =>
          b.addEventListener('click', () => { state.setupId = b.dataset.setupId; renderSetupFiles(); })
        );
        panel.querySelectorAll('[data-fmt]').forEach((b) =>
          b.addEventListener('click', () => { state.setupFormat = b.dataset.fmt; renderSetupFiles(); })
        );
        document.getElementById('copy-setup-btn').addEventListener('click', () => {
          copyText(rawText, `Copied ${state.setupFormat} (${activeFile.name})`);
        });
        document.getElementById('dl-setup-btn').addEventListener('click', () => {
          const blob = new Blob([rawText], { type: 'text/markdown;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = state.setupFormat;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast(`Downloaded ${state.setupFormat}`);
        });
      }

      /* --------------------------------------------------------------------
         15. COMMAND PALETTE (Cmd+K / Ctrl+K / '/')
      -------------------------------------------------------------------- */
      function buildCommandIndex() {
        const items = [];
        BLUEPRINTS.forEach((bp) => {
          items.push({
            type: 'Blueprint',
            badge: 'badge-cyan',
            title: bp.title,
            sub: bp.primaryStack,
            action: () => {
              switchTab('bible');
              openDrawer(bp.id);
            }
          });
        });
        RUNTIMES.forEach((rt) => {
          items.push({
            type: 'Runtime',
            badge: 'badge-emerald',
            title: rt.name,
            sub: `Cold: ${rt.coldStart} · Verifier: ${rt.verifierScore}/100`,
            action: () => switchTab('arena')
          });
        });
        COST_PRESETS.forEach((p) => {
          items.push({
            type: 'Cost Preset',
            badge: 'badge-amber',
            title: p.label,
            sub: 'Load scenario into Cost-at-Scale Pricing Lab',
            action: () => {
              state.costReqsIdx = p.reqsIdx;
              state.costWallMs = p.wall;
              state.costCpuPct = p.cpu;
              state.costEgressGb = p.egress;
              state.costWs = p.ws;
              switchTab('cost');
            }
          });
        });
        SETUP_FILES.forEach((f) => {
          items.push({
            type: 'AGENTS.md',
            badge: 'badge-indigo',
            title: f.name,
            sub: f.subtitle,
            action: () => {
              state.setupId = f.id;
              switchTab('setup');
            }
          });
        });
        return items;
      }

      const CMD_INDEX = buildCommandIndex();

      function getFilteredCommands() {
        const q = state.cmdQuery.toLowerCase().trim();
        if (!q) return CMD_INDEX.slice(0, 12);
        return CMD_INDEX.filter(
          (item) =>
            item.title.toLowerCase().includes(q) ||
            item.sub.toLowerCase().includes(q) ||
            item.type.toLowerCase().includes(q)
        ).slice(0, 14);
      }

      function renderCommandResults() {
        const container = document.getElementById('cmd-results');
        const list = getFilteredCommands();
        if (state.cmdActiveIdx >= list.length) state.cmdActiveIdx = 0;

        if (list.length === 0) {
          container.innerHTML = `<div style="padding:28px;text-align:center;color:var(--text-muted);font-size:13px;">No matching blueprints, runtimes, or setup files.</div>`;
          return;
        }

        container.innerHTML = list
          .map(
            (item, idx) => `
          <button class="cmd-item ${idx === state.cmdActiveIdx ? 'active' : ''}" data-cmd-idx="${idx}">
            <div style="min-width:0;">
              <div style="font-size:13.5px;font-weight:600;color:#fff;" class="truncate">${escapeHtml(item.title)}</div>
              <div class="mono truncate" style="font-size:11px;color:var(--text-muted);margin-top:2px;">${escapeHtml(item.sub)}</div>
            </div>
            <span class="badge ${item.badge}" style="flex-shrink:0;">${item.type}</span>
          </button>
        `
          )
          .join('');

        container.querySelectorAll('.cmd-item').forEach((btn) => {
          btn.addEventListener('click', () => {
            const item = list[Number(btn.dataset.cmdIdx)];
            closeCmdPalette();
            if (item) item.action();
          });
        });
      }

      function openCmdPalette() {
        state.cmdOpen = true;
        state.cmdQuery = '';
        state.cmdActiveIdx = 0;
        const backdrop = document.getElementById('cmd-backdrop');
        const input = document.getElementById('cmd-input');
        backdrop.classList.add('open');
        input.value = '';
        renderCommandResults();
        setTimeout(() => input.focus(), 20);
      }

      function closeCmdPalette() {
        state.cmdOpen = false;
        document.getElementById('cmd-backdrop').classList.remove('open');
      }

      /* --------------------------------------------------------------------
         16. GLOBAL EVENT LISTENERS & KEYBOARD SHORTCUTS
      -------------------------------------------------------------------- */
      function initEvents() {
        document.getElementById('open-cmd-btn').addEventListener('click', openCmdPalette);
        document.getElementById('drawer-backdrop').addEventListener('click', closeDrawer);
        document.getElementById('cmd-backdrop').addEventListener('click', (e) => {
          if (e.target.id === 'cmd-backdrop') closeCmdPalette();
        });

        document.getElementById('cmd-input').addEventListener('input', (e) => {
          state.cmdQuery = e.target.value;
          state.cmdActiveIdx = 0;
          renderCommandResults();
        });

        window.addEventListener('keydown', (e) => {
          const tag = document.activeElement?.tagName;
          const isTyping = tag === 'INPUT' || tag === 'TEXTAREA';

          // Cmd+K or Ctrl+K
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
            e.preventDefault();
            state.cmdOpen ? closeCmdPalette() : openCmdPalette();
            return;
          }

          // Slash '/' to open palette when not typing
          if (e.key === '/' && !isTyping && !state.cmdOpen) {
            e.preventDefault();
            openCmdPalette();
            return;
          }

          // Escape closes palette or drawer
          if (e.key === 'Escape') {
            if (state.cmdOpen) closeCmdPalette();
            else if (state.drawerBlueprintId) closeDrawer();
            return;
          }

          // Command Palette arrow navigation
          if (state.cmdOpen) {
            const list = getFilteredCommands();
            if (e.key === 'ArrowDown') {
              e.preventDefault();
              state.cmdActiveIdx = (state.cmdActiveIdx + 1) % Math.max(1, list.length);
              renderCommandResults();
            } else if (e.key === 'ArrowUp') {
              e.preventDefault();
              state.cmdActiveIdx = (state.cmdActiveIdx - 1 + list.length) % Math.max(1, list.length);
              renderCommandResults();
            } else if (e.key === 'Enter' && list[state.cmdActiveIdx]) {
              e.preventDefault();
              const chosen = list[state.cmdActiveIdx];
              closeCmdPalette();
              chosen.action();
            }
            return;
          }

          // Number keys 1-5 switch modules when not typing
          if (!isTyping && !e.metaKey && !e.ctrlKey && !e.altKey) {
            const idx = Number(e.key) - 1;
            if (idx >= 0 && idx < TABS.length) {
              switchTab(TABS[idx].id);
            }
          }
        });
      }

      /* --------------------------------------------------------------------
         17. BOOTSTRAP APPLICATION
      -------------------------------------------------------------------- */
      renderNav();
      renderDecisionEngine();
      initEvents();
    })();
  </script>
</body>
